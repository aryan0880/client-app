# ============================================================================
# Render Blueprint — 1-Click Deploy for FoodScan AI Backend
# Docs: https://render.com/docs/infrastructure-as-code
#
# How to use:
#   1. Commit this file to your repo at backend/render.yaml
#   2. Go to https://dashboard.render.com/blueprints
#   3. Click "New Blueprint Instance" → pick your repo → this file
#   4. Fill in JWT_SECRET + GEMINI_API_KEY when prompted → Apply
#
# This creates:
#   • 1 PostgreSQL database (FREE tier 90 days, ~$7/month after)
#   • 1 Web Service running the Dockerfile in /backend (paid ~$7/month)
# ============================================================================

services:
  - type: web
    name: foodscan-ai-backend
    runtime: docker
    rootDir: backend
    dockerCommand: ""
    plan: starter
    autoDeploy: yes
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5001"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: foodscan-ai-db
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        value: ""

  - type: web
    name: foodscan-ai-backend-free
    runtime: docker
    rootDir: backend
    dockerCommand: ""
    plan: free
    autoDeploy: yes
    suspended: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5001"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: foodscan-ai-db
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        value: ""

databases:
  - name: foodscan-ai-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: foodscan
    user: foodscan_admin
    ipAllowList: []
