services:
  - type: web
    name: foodscan-ai-backend
    runtime: docker
    rootDir: backend
    plan: free
    autoDeploy: yes
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5001"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: foodscan-ai-db
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        value: ""

databases:
  - name: foodscan-ai-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: foodscan
    user: foodscan_admin
