// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // OneDrive-synced folder compatibility: disable file-system snapshots
    // globally for all subprojects to prevent "Cannot snapshot" errors
    // during mergeDebugAssets / aapt2 work because OneDrive locks temp files.
    plugins.withId('com.android.application') {
        afterEvaluate {
            android {
                buildFeatures {
                    // Disable viewBinding / dataBinding snapshots if enabled (safe default)
                }
                // Move intermediate build outputs per module outside OneDrive tree
                project.buildDir = new File(rootDir.parentFile.parentFile.parentFile.parentFile, ".android-build-cache/foodscan-ai/" + project.name + "/build")
            }
        }
    }
    plugins.withId('com.android.library') {
        afterEvaluate {
            android {
                project.buildDir = new File(rootDir.parentFile.parentFile.parentFile.parentFile, ".android-build-cache/foodscan-ai/" + project.name + "/build")
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
    // Also wipe the relocated build cache dir on clean task
    delete new File(rootDir.parentFile.parentFile.parentFile.parentFile, ".android-build-cache/foodscan-ai")
}
